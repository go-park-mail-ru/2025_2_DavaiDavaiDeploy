name: Kinopoisk deploy

on:
  push:
    branches:
      - main  
      - develop 

jobs:
  govulncheck:
    name: Run govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1

  deploy:
    name: Deploy MyApp
    needs: govulncheck
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Pull code 
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }} 
          username: ubuntu
          key: ${{ secrets.PRIVATE_KEY }}
          script: cd /home/ubuntu/backend/2025_2_DavaiDavaiDeploy && git stash && git pull 

      - name: Build containers 
        uses: appleboy/ssh-action@master
        with:
          timeout: 30m
          command_timeout: 30m
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.PRIVATE_KEY }}
          script: cd /home/ubuntu/backend/2025_2_DavaiDavaiDeploy 

      - name: Restart service 
        uses: appleboy/ssh-action@master
        with:
          timeout: 30m
          command_timeout: 30m
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.PRIVATE_KEY }}
          script: cd /home/ubuntu/backend/2025_2_DavaiDavaiDeploy && sudo docker compose down -v && sudo docker compose up -d --build
